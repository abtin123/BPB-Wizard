```yaml
name: Build and Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64, arm, 386]
        exclude:
          - goos: darwin
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: windows
            goarch: arm
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26'

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Wizard
        run: make build VERSION="$VERSION" GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      # Download worker.js only once, avoiding duplicate uploads
      # from every operating-system build.
      - name: Download Worker Panel
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 \
            "https://github.com/abtin123/BPB-Worker-Panel/releases/latest/download/worker.js" \
            --output dist/worker.js
          test -s dist/worker.js
          echo "worker.js downloaded successfully:"
          ls -lh dist/worker.js

      - name: Verify Worker Panel asset
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/worker.js
          test -s dist/worker.js

      - name: Read release note
        id: read_release
        shell: bash
        run: |
          r="$(cat RELEASE.md)"
          r="${r//'%'/'%25'}"
          r="${r//$'\n'/'%0A'}"
          r="${r//$'\r'/'%0D'}"
          echo "RELEASE_BODY=$r" >> "$GITHUB_OUTPUT"

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          tag: ${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          overwrite: true
          file_glob: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          promote: ${{ github.ref == 'refs/heads/main' }}
          body: ${{ steps.read_release.outputs.RELEASE_BODY }}
