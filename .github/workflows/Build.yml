name: Build and Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64, arm, 386]
        exclude:
          - goos: darwin
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: windows
            goarch: arm
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        
      - name: Setup Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.26

      - name: Read version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Build and zip
        run: make build VERSION=$VERSION GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      # Build the panel worker from the user's own panel repository and publish it
      # as worker.js in this Wizard release. Only one matrix leg needs to do this.
      - name: Check out panel source
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/checkout@v4
        with:
          repository: abtin123/BPB-Worker-Panel
          ref: main
          path: panel-source

      - name: Set up Node.js for panel build
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build panel worker asset
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: panel-source
        run: |
          npm install
          npm run check
          npm run build
          test -s dist/worker.js
          mkdir -p ../dist
          cp dist/worker.js ../dist/worker.js

      - name: Read release note
        id: read_release
        shell: bash
        run: |
          r=$(cat RELEASE.md)         
          r="${r//'%'/'%25'}"                               
          r="${r//$'\n'/'%0A'}"                             
          r="${r//$'\r'/'%0D'}"                             
          echo "RELEASE_BODY=$r" >> $GITHUB_OUTPUT          

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          tag: ${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          overwrite: true
          file_glob: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          promote: ${{ github.ref == 'refs/heads/main' }}
          body: ${{ steps.read_release.outputs.RELEASE_BODY }}
